# Hold a pull request to the API contract: its schema.yml and
# allauth-schema.yml must be able to be live together with the storefront
# and the agent gateway that production and staging run NOW.
#
# The storefront answers 422 to every response its generated schemas
# reject, so removing or loosening a response field, adding an enum value
# or a success status breaks the storefront that is live until a release
# that accepts it is deployed (2026-10-13: add to cart down on webside for
# ~8 minutes). And a storefront that requires a field the live Django does
# not serve breaks the other way. A change that has no safe deploy order
# (2026-11-03: a required field plus an enum value, Django #442 / storefront
# #347) therefore cannot merge: it has to be split.
#
# api-contract/ holds the rule: the same script and rules the deploy gate in
# grooveshop-infrastructure runs (a verdict here is the verdict there), and
# an accepted break is a dated line in api-contract/ignore.txt, reviewed in
# the pull request that makes the change. What is live comes from GitHub
# Deployments, recorded from the running pods
# (grooveshop-infrastructure/manifests/app-constructs/grooveshop/recorder).
# See api-contract/README.md and the reusable workflow it calls.
#
# Its own workflow, not a job in ci.yml: it needs no code checkout beyond
# this one and no database. The job always reports, so it is a required
# status check; a pull request that touches no contract document passes at
# once (api-contract/watched.txt).
name: API contract

on:
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: API contract
    uses: ./.github/workflows/api-contract-check.yml
    with:
      kind: django
