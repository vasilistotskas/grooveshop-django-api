name: CI

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYSTEM_ENV: ci
  DEBUG: 'True'
  MEILI_HOST: 127.0.0.1
  UV_VERSION: '0.12.5'
  FORCE_COLOR: 1

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        # SHA-pinned: trivy-action's mutable tags were hijacked in the
        # 2026-03 supply-chain incident, so tags are not trusted.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          skip-dirs: .venv,node_modules,dist,.output
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff format check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: 'format --check'

      - name: Ruff lint check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: 'check .'

      - name: Type check (ty)
        run: uv run ty check

      - name: OpenAPI schema validate
        # spectacular --validate runs the OpenAPI spec through
        # openapi-spec-validator and exits non-zero on any error.
        # ``--fail-on-warn`` is intentionally NOT set: drf-spectacular
        # emits informational warnings for cross-app operationId
        # collisions (e.g. multiple ViewSets named ``listPayWay``) which
        # it auto-resolves with numeric suffixes. Those warnings are
        # noise, not errors. Real schema errors still fail this step.
        # This step only needs the Django app registry — no live DB
        # required because spectacular uses the ORM class definitions,
        # not live data.
        run: >
          uv run python manage.py spectacular
          --validate
          --file /tmp/_schema_check.yml
        env:
          DJANGO_SETTINGS_MODULE: settings

  migrations:
    name: Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Validates both django-tenants migration paths on a clean DB:
    # ``migrate_schemas --shared`` for SHARED_APPS (which also runs the
    # ``tenant.0002_seed_webside_tenant`` seed), then the TENANT_APPS
    # path against the seeded webside schema. Lives in its own job so
    # its ~4 min run in parallel with the test shards instead of on
    # their critical path — pytest builds its own test databases and
    # does not depend on this DB. Redis + Meilisearch services mirror
    # the testing job: the tenant seed's ``post_save`` signal touches
    # the Redis-backed resolve cache.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        ports:
          - 7700:7700
        env:
          MEILI_HTTP_ADDR: meilisearch:7700
          MEILI_LOG_LEVEL: INFO
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          MEILI_ENV: production

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      MEILI_HTTP_ADDR: meilisearch:7700
      MEILI_LOG_LEVEL: INFO
      MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
      MEILI_ENV: production

    steps:
      - name: Start PostgreSQL
        # Same tuned container as the testing job — see its comment.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg prerequisites
        run: sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run migrations (django-tenants)
        run: |
          uv run python manage.py migrate_schemas --shared
          uv run python manage.py migrate_schemas --schema=webside

  testing:
    name: Testing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # PostgreSQL runs as a docker-run STEP, not a service container:
    # PG18 needs max_locks_per_transaction raised for this suite's
    # parallel DDL (validated: defaults exhaust the lock table under
    # xdist; shm-size alone does not fix it), and GitHub service
    # containers cannot pass server arguments. The step form also keeps
    # CI aligned with infra.compose.yml, which sets the same knob.
    # tmpfs mounts the PARENT path — 18+ images use major-versioned
    # data subdirectories and refuse the legacy .../data mount.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        ports:
          - 7700:7700
        env:
          MEILI_HTTP_ADDR: meilisearch:7700
          MEILI_LOG_LEVEL: INFO
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          MEILI_ENV: production

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      MEILI_HTTP_ADDR: meilisearch:7700
      MEILI_LOG_LEVEL: INFO
      MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
      MEILI_ENV: production

    steps:
      - name: Start PostgreSQL
        # See the comment on `services:` — a step, not a service, so the
        # server args can be passed. Matches prod's major and
        # infra.compose.yml's tuning.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg prerequisites
        run: sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Tests (shard)
        # ``--dist loadfile`` is mandatory for stability per
        # ``project_test_suite_stability.md`` — interleaving tests
        # from different files on the same xdist worker (the
        # ``worksteal`` default) leaks module-level singletons (the
        # ``translation_reload`` middleware version, ``extra_settings``
        # cache, factory random state) and produces 1-3 random flakes
        # per CI run. ``-n auto`` and ``--dist loadfile`` are also set
        # in ``pyproject.toml::addopts`` — keeping them explicit here
        # so a careless edit can't silently flip the project off the
        # supported configuration.
        # The suite is split into 4 duration-balanced shards by
        # pytest-split from the committed ``.test_durations`` file.
        # The default ``duration_based_chunks`` algorithm is the ONLY
        # one this suite supports: it splits contiguous blocks, so a
        # file's tests stay in one shard. ``least_duration`` balances
        # better on paper but assigns tests individually, scattering a
        # file across shards — validated 2026-08-29 (run 33245930085):
        # it split test_dynamic_pricing.py 11/6/4/11 across the four
        # shards and three of its tests failed from worker-pollution,
        # the same class of leak ``--dist loadfile`` exists to prevent.
        # Shard 3 running ~1-2 min longer than the rest is the accepted
        # cost; a CI-weighted ``.test_durations`` refresh is the only
        # safe rebalancing lever.
        # Refresh ``.test_durations`` occasionally with ``uv run pytest
        # --store-durations`` (HYPOTHESIS_PROFILE=ci for CI-like
        # weights); tests missing from the file are assumed average, so
        # drift costs balance, never correctness. Four shards, not more:
        # each shard pays a fixed ~3 min creating its xdist worker
        # test-databases (validated locally with ``--create-db -n 4``),
        # so extra shards mostly buy overhead.
        # Coverage: shards upload raw data files; the ``coverage`` job
        # combines them and enforces ``fail_under`` for the whole suite.
        # A single shard's percentage is meaningless, so the per-shard
        # run must not gate (``--cov-fail-under=0``) and prints no
        # report (``--cov-report=``). Note the coverage CORE is not a
        # lever here: an A/B of CI runs (2026-08-25, ctrace 31:44 vs
        # sysmon 34:27) showed the suite is DB/fixture-bound. If a shard
        # creeps toward its timeout, profile first:
        # pytest --durations=25.
        run: >
          uv run pytest --cov=. --cov-report= --cov-fail-under=0
          --cov-config=pyproject.toml -n auto --dist loadfile
          --splits 4 --group ${{ matrix.group }}
        timeout-minutes: 18
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Stage coverage data for upload
        # upload-artifact excludes dotfiles by default; a visible,
        # shard-unique name also lets the coverage job combine the
        # merged downloads directly.
        run: mv .coverage coverage-shard-${{ matrix.group }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.group }}
          path: coverage-shard-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 1

  test-mt:
    name: Testing (multi-tenant lane)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ``tests_mt/`` is a SIBLING of ``tests/``, deliberately excluded from
    # `testpaths` and from the ``testing`` job above: it keeps the real
    # ``TenantSyncRouter`` + ``TenantMainMiddleware`` (the main suite strips
    # both for speed), so schema-binding regressions the 6000+ test suite
    # can never see — a cross-schema FK, a cache-key leak, a seed migration
    # that silently stops reaching new tenants — fail here instead. See
    # ``tests_mt/conftest.py`` and CLAUDE.md's test section.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Start PostgreSQL
        # Same tuned container as the ``testing`` job — see its comment.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg prerequisites
        run: sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run MT lane
        # Serial (-n 0): the lane is small (~10 tests) and schema
        # switching is process-global via ``connection`` — xdist would
        # need per-worker schemas for no real benefit here.
        run: uv run pytest tests_mt -n 0

  coverage:
    name: Coverage Gate
    needs: testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine and enforce coverage
        # ``coverage report`` reads ``fail_under`` from pyproject
        # (currently 70) and exits non-zero below it — the single
        # coverage gate for the whole suite. ``relative_files = true``
        # in the coverage config is what makes data files combinable
        # across runners.
        run: |
          uv run coverage combine coverage-shard-*
          uv run coverage report

  release:
    needs: [quality, migrations, testing, coverage, security-scan]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The PAT, not GITHUB_TOKEN: the version commit + tag pushed
          # below must be attributed the same way the PSR action did
          # it, and the release event it creates must trigger the
          # docker publish workflow (GITHUB_TOKEN events do not).
          token: ${{ secrets.DJANGO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Python Semantic Release
        id: release
        # Inline replacement for the python-semantic-release ACTION:
        # its Docker image pip-installs dependencies UNPINNED at
        # workflow runtime, and GitPython 3.1.60 (released 2026-08-25)
        # removed Actor.name_email_regex, crashing PSR 10.x everywhere.
        # Same PSR version, GitPython pinned to the release that
        # shipped this morning's v3.10.0. Revert to the action once a
        # PSR release is compatible with GitPython >= 3.1.60.
        env:
          GH_TOKEN: ${{ secrets.DJANGO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before=$(git describe --tags --abbrev=0)
          uvx --from "python-semantic-release==10.5.3" \
              --with "gitpython==3.1.59" \
              semantic-release -v version
          after=$(git describe --tags --abbrev=0)
          echo "version=${after#v}" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync uv.lock to released version
        # ``python-semantic-release`` only bumps ``pyproject.toml``;
        # ``uv.lock`` keeps the previous version in its
        # ``[[package]]`` entry for the project itself, so subsequent
        # ``uv sync --locked`` runs on the next push fail with
        # "lockfile needs to be updated". Refresh the lockfile and
        # commit it back so main stays consistent.
        if: steps.release.outputs.released == 'true'
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet uv.lock; then
            git add uv.lock
            git commit -m "chore(deps): sync uv.lock to ${{ steps.release.outputs.version }} [skip ci]"
            git push
          fi
