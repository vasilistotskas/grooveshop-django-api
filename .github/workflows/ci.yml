name: CI

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYSTEM_ENV: ci
  DEBUG: 'True'
  MEILI_HOST: 127.0.0.1
  UV_VERSION: '0.12.5'
  FORCE_COLOR: 1

jobs:
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          skip-dirs: .venv,node_modules,dist,.output
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff format check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: 'format --check'

      - name: Ruff lint check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: 'check .'

      - name: Type check (ty)
        run: uv run ty check

      - name: OpenAPI schema validate
        # spectacular --validate runs the OpenAPI spec through
        # openapi-spec-validator and exits non-zero on any error.
        # ``--fail-on-warn`` is intentionally NOT set: drf-spectacular
        # emits informational warnings for cross-app operationId
        # collisions (e.g. multiple ViewSets named ``listPayWay``) which
        # it auto-resolves with numeric suffixes. Those warnings are
        # noise, not errors. Real schema errors still fail this step.
        # This step only needs the Django app registry — no live DB
        # required because spectacular uses the ORM class definitions,
        # not live data.
        run: >
          uv run python manage.py spectacular
          --validate
          --file /tmp/_schema_check.yml
        env:
          DJANGO_SETTINGS_MODULE: settings

  testing:
    name: Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL runs as a docker-run STEP, not a service container:
    # PG18 needs max_locks_per_transaction raised for this suite's
    # parallel DDL (validated: defaults exhaust the lock table under
    # xdist; shm-size alone does not fix it), and GitHub service
    # containers cannot pass server arguments. The step form also keeps
    # CI aligned with infra.compose.yml, which sets the same knob.
    # tmpfs mounts the PARENT path — 18+ images use major-versioned
    # data subdirectories and refuse the legacy .../data mount.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        ports:
          - 7700:7700
        env:
          MEILI_HTTP_ADDR: meilisearch:7700
          MEILI_LOG_LEVEL: INFO
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          MEILI_ENV: production

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      MEILI_HTTP_ADDR: meilisearch:7700
      MEILI_LOG_LEVEL: INFO
      MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
      MEILI_ENV: production

    steps:
      - name: Start PostgreSQL
        # See the comment on `services:` — a step, not a service, so the
        # server args can be passed. Matches prod's major and
        # infra.compose.yml's tuning.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg prerequisites
        run: sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run migrations (django-tenants)
        # Using ``migrate_schemas --shared`` for SHARED_APPS first, then
        # exercising the TENANT_APPS migration path against the seeded
        # webside schema (created by ``tenant.0002_seed_webside_tenant``
        # which runs as part of ``--shared``). This validates both shared
        # and tenant migration paths on a clean DB.
        run: |
          uv run python manage.py migrate_schemas --shared
          uv run python manage.py migrate_schemas --schema=webside

      - name: Run Tests
        # ``--dist loadfile`` is mandatory for stability per
        # ``project_test_suite_stability.md`` — interleaving tests
        # from different files on the same xdist worker (the
        # ``worksteal`` default) leaks module-level singletons (the
        # ``translation_reload`` middleware version, ``extra_settings``
        # cache, factory random state) and produces 1-3 random flakes
        # per CI run. ``-n auto`` and ``--dist loadfile`` are also set
        # in ``pyproject.toml::addopts`` — keeping them explicit here
        # so a careless edit can't silently flip the project off the
        # supported configuration.
        # The 25-min timeout absorbs coverage overhead (~2-3× the no-cov
        # runtime) on the 2-vCPU GitHub runner. Previous 15-min cap
        # timed out at ~85% of the suite once tenant-scoping work
        # extended a few teardown hot paths (transaction.on_commit
        # immediate fixture + extra_settings cache.delete_many per test).
        run: uv run pytest --cov=. --cov-report=term --cov-report=html --cov-config=pyproject.toml -n auto --dist loadfile
        timeout-minutes: 25
        env:
          HYPOTHESIS_PROFILE: ci

  release:
    needs: [quality, testing, security-scan]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.DJANGO_TOKEN }}

      - name: Sync uv.lock to released version
        # ``python-semantic-release`` only bumps ``pyproject.toml``;
        # ``uv.lock`` keeps the previous version in its
        # ``[[package]]`` entry for the project itself, so subsequent
        # ``uv sync --locked`` runs on the next push fail with
        # "lockfile needs to be updated". Refresh the lockfile and
        # commit it back so main stays consistent.
        if: steps.release.outputs.released == 'true'
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet uv.lock; then
            git add uv.lock
            git commit -m "chore(deps): sync uv.lock to ${{ steps.release.outputs.version }} [skip ci]"
            git push
          fi
