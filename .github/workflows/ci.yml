name: CI

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYSTEM_ENV: ci
  DEBUG: 'True'
  MEILI_HOST: 127.0.0.1
  # The key of the throwaway Meilisearch service the test jobs start, so not
  # a secret, like their PostgreSQL password. Read from a repository secret
  # it was empty in every Dependabot run (Dependabot-triggered workflows get
  # no Actions secrets), and those runs failed at settings import.
  # Meilisearch's production mode wants at least 16 bytes.
  MEILI_MASTER_KEY: ci-throwaway-meilisearch-key
  UV_VERSION: '0.13.6'
  FORCE_COLOR: 1
  # oasdiff, pinned by digest; the same image as api-contract.yml and as
  # the deploy gate in grooveshop-infrastructure (prepare-helm values).
  OASDIFF_IMAGE: tufin/oasdiff:v1.32.1@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac

jobs:
  tested-in-pr:
    name: Already tested in its PR
    # A push to main whose tree is exactly what a green pull_request run
    # tested (the PR branch was up to date with main when it merged) skips
    # quality, migrations and the test jobs, and goes straight to release.
    # The rule and its proof: .github/scripts/tested_in_pr.sh. Any other
    # push, a PR or a dispatch runs everything. The Trivy scan always runs:
    # its database moves daily, not with the code.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Same tree as a green PR run
        id: check
        if: github.event_name == 'push'
        # An API error leaves ``tested`` unset, which runs everything: the
        # cost of a failed check is time, never an untested release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/tested_in_pr.sh "$GITHUB_SHA" "$BEFORE" >> "$GITHUB_OUTPUT"

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        # SHA-pinned: trivy-action's mutable tags were hijacked in the
        # 2026-03 supply-chain incident, so tags are not trusted.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          skip-dirs: .venv,node_modules,dist,.output
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  quality:
    name: Code Quality
    needs: tested-in-pr
    if: needs.tested-in-pr.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Ruff format check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: 'format --check'

      - name: Ruff lint check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: 'check .'

      - name: Type check (ty)
        run: uv run ty check

      - name: Compile translations
        # The schema depends on the compiled catalogue: without the .mo
        # files drf-spectacular inlines the choice enums instead of
        # referencing their components, so the generated schema would not
        # match the committed one (or what production serves, whose image
        # compiles them in the Dockerfile). gettext provides msgfmt, which
        # the runner image does not ship.
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          uv run python manage.py compilemessages --ignore=.venv

      - name: OpenAPI schema validate
        # spectacular --validate runs the OpenAPI spec through
        # openapi-spec-validator and exits non-zero on any error.
        # ``--fail-on-warn`` is intentionally NOT set: drf-spectacular
        # emits informational warnings for cross-app operationId
        # collisions (e.g. multiple ViewSets named ``listPayWay``) which
        # it auto-resolves with numeric suffixes. Those warnings are
        # noise, not errors. Real schema errors still fail this step.
        # This step only needs the Django app registry — no live DB
        # required because spectacular uses the ORM class definitions,
        # not live data.
        run: >
          uv run python manage.py spectacular
          --validate
          --file /tmp/_schema_check.yml
        env:
          DJANGO_SETTINGS_MODULE: settings

      - name: OpenAPI schema.yml is up to date
        # Every contract check reads the COMMITTED schema.yml: the
        # storefront generates its types from it, the API contract
        # workflow diffs it against the PR's base, and the deploy gate in
        # grooveshop-infrastructure checks it against the storefront that
        # will be live. A serializer change committed without
        # ``manage.py spectacular --file schema.yml`` would slip past all
        # of them. Structure only: descriptions, titles and examples are
        # generated in whichever language is active, so the committed
        # prose may be Greek while this run's is English.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/schema.yml:/s/committed.yml:ro" \
            -v /tmp/_schema_check.yml:/s/generated.yml:ro \
            "$OASDIFF_IMAGE" diff --allow-external-refs=false \
            --exclude-elements description,title,summary,examples \
            --fail-on-diff /s/committed.yml /s/generated.yml || {
            echo "::error file=schema.yml::schema.yml does not match the code. Run: uv run python manage.py spectacular --file schema.yml"
            exit 1
          }

  migrations:
    name: Migration Check
    needs: tested-in-pr
    if: needs.tested-in-pr.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Replays a deploy: the database is migrated at the BASE commit (PR
    # base, or the previous tip of main), then the head's
    # ``migration_preflight`` judges the pending migrations against it —
    # the same check the Argo CD PreSync hook runs as its step 0 — and
    # the head migrations are applied on top. Both django-tenants paths
    # run each time: ``migrate_schemas --shared`` for SHARED_APPS (which
    # also runs the ``tenant.0002_seed_webside_tenant`` seed), then the
    # TENANT_APPS path against the seeded webside schema. The clean-DB
    # path stays covered by pytest, which builds its test databases from
    # the full migration history. Lives in its own job so it runs in
    # parallel with the test shards. Redis + Meilisearch services mirror
    # the testing job: the tenant seed's ``post_save`` signal touches
    # the Redis-backed resolve cache.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        ports:
          - 7700:7700
        env:
          MEILI_HTTP_ADDR: meilisearch:7700
          MEILI_LOG_LEVEL: INFO
          MEILI_MASTER_KEY: ${{ env.MEILI_MASTER_KEY }}
          MEILI_ENV: production

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      MEILI_HTTP_ADDR: meilisearch:7700
      MEILI_LOG_LEVEL: INFO
      MEILI_ENV: production

    steps:
      - name: Start PostgreSQL
        # Same tuned container as the testing job — see its comment.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The base commit has to be reachable to migrate from it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg prerequisites
        run: sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Resolve the deploy base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # workflow_dispatch has neither; a new branch's ``before`` is
          # all zeros. Fall back to the parent commit.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploy replay: $base -> $(git rev-parse HEAD)"

      - name: Migrate at the base commit (the serving release)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          uv sync --locked --all-extras --dev
          uv run python manage.py migrate_schemas --shared
          uv run python manage.py migrate_schemas --schema=webside

      - name: Install Dependencies
        env:
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          git checkout --detach "$HEAD_SHA"
          uv sync --locked --all-extras --dev

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Migration preflight (PreSync step 0)
        run: uv run python manage.py migration_preflight

      - name: Run migrations (django-tenants)
        run: |
          uv run python manage.py migrate_schemas --shared
          uv run python manage.py migrate_schemas --schema=webside

  testing:
    name: Testing
    needs: tested-in-pr
    if: needs.tested-in-pr.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # PostgreSQL runs as a docker-run STEP, not a service container:
    # PG18 needs max_locks_per_transaction raised for this suite's
    # parallel DDL (validated: defaults exhaust the lock table under
    # xdist; shm-size alone does not fix it), and GitHub service
    # containers cannot pass server arguments. The step form also keeps
    # CI aligned with infra.compose.yml, which sets the same knob.
    # tmpfs mounts the PARENT path — 18+ images use major-versioned
    # data subdirectories and refuse the legacy .../data mount.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        ports:
          - 7700:7700
        env:
          MEILI_HTTP_ADDR: meilisearch:7700
          MEILI_LOG_LEVEL: INFO
          MEILI_MASTER_KEY: ${{ env.MEILI_MASTER_KEY }}
          MEILI_ENV: production

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      MEILI_HTTP_ADDR: meilisearch:7700
      MEILI_LOG_LEVEL: INFO
      MEILI_ENV: production

    steps:
      - name: Start PostgreSQL
        # See the comment on `services:` — a step, not a service, so the
        # server args can be passed. Matches prod's major and
        # infra.compose.yml's tuning.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg and gettext prerequisites
        # gettext for ``compilemessages`` below; the runner image does
        # not ship msgfmt.
        run: sudo apt-get install -y --no-install-recommends libpq-dev gettext

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Compile translations
        # The same step as the Dockerfile's, so tests run against the
        # Greek catalogue production serves. Without it gettext fell back
        # to the English msgid here and a test asserting English text
        # passed in CI but failed on any machine that had compiled the
        # catalogue — the ``assert_english`` marker (tests/conftest.py)
        # is what such a test needs, and only this step makes CI notice
        # a missing one.
        run: uv run python manage.py compilemessages --ignore=.venv

      - name: Run Tests (shard)
        # ``--dist loadfile`` is mandatory for stability per
        # ``project_test_suite_stability.md`` — interleaving tests
        # from different files on the same xdist worker (the
        # ``worksteal`` default) leaks module-level singletons (the
        # ``translation_reload`` middleware version, ``extra_settings``
        # cache, factory random state) and produces 1-3 random flakes
        # per CI run. ``-n auto`` and ``--dist loadfile`` are also set
        # in ``pyproject.toml::addopts`` — keeping them explicit here
        # so a careless edit can't silently flip the project off the
        # supported configuration.
        # The suite is split into 4 duration-balanced shards by
        # pytest-split from the committed ``.test_durations`` file.
        # The default ``duration_based_chunks`` algorithm is the ONLY
        # one this suite supports: it splits contiguous blocks, so a
        # file's tests stay in one shard. ``least_duration`` balances
        # better on paper but assigns tests individually, scattering a
        # file across shards — validated 2026-08-29 (run 33245930085):
        # it split test_dynamic_pricing.py 11/6/4/11 across the four
        # shards and three of its tests failed from worker-pollution,
        # the same class of leak ``--dist loadfile`` exists to prevent.
        # Shard 3 running ~1-2 min longer than the rest is the accepted
        # cost; a CI-weighted ``.test_durations`` refresh is the only
        # safe rebalancing lever.
        # The weights come from CI itself. Each shard splits from a copy
        # of ``.test_durations`` (so the split is unchanged) and, with
        # ``--store-durations --clean-durations``, rewrites that copy
        # with only the tests it ran, timed on this runner under this
        # coverage and xdist load; the next steps upload it. To refresh:
        # ``python .github/scripts/merge_test_durations.py`` merges the
        # four shards of the latest green pull_request run, then commit the
        # file. A LOCAL ``--store-durations`` run records a developer
        # machine instead: the 2026-09-26 one estimated the groups
        # within 0.7% of each other and they ran 9-16 minutes on CI.
        # Tests missing from the file are assumed average, so drift
        # costs balance, never correctness. Four shards, not more:
        # each shard pays a fixed ~3 min creating its xdist worker
        # test-databases (validated locally with ``--create-db -n 4``),
        # so extra shards mostly buy overhead.
        # Coverage: shards upload raw data files; the ``coverage`` job
        # combines them and enforces ``fail_under`` for the whole suite.
        # A single shard's percentage is meaningless, so the per-shard
        # run must not gate (``--cov-fail-under=0``) and prints no
        # report (``--cov-report=``). Note the coverage CORE is not a
        # lever here: an A/B of CI runs (2026-08-25, ctrace 31:44 vs
        # sysmon 34:27) showed the suite is DB/fixture-bound. If a shard
        # creeps toward its timeout, profile first:
        # pytest --durations=25.
        run: >
          cp .test_durations test-durations-shard-${{ matrix.group }}.json &&
          uv run pytest --cov=. --cov-report= --cov-fail-under=0
          --cov-config=pyproject.toml -n auto --dist loadfile
          --splits 4 --group ${{ matrix.group }}
          --durations-path test-durations-shard-${{ matrix.group }}.json
          --store-durations --clean-durations
        timeout-minutes: 18
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Upload shard durations
        # Read by .github/scripts/merge_test_durations.py; kept two
        # weeks so a refresh can pick any recent green run.
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-shard-${{ matrix.group }}
          path: test-durations-shard-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Stage coverage data for upload
        # upload-artifact excludes dotfiles by default; a visible,
        # shard-unique name also lets the coverage job combine the
        # merged downloads directly.
        run: mv .coverage coverage-shard-${{ matrix.group }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.group }}
          path: coverage-shard-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 1

  test-mt:
    name: Testing (multi-tenant lane)
    needs: tested-in-pr
    if: needs.tested-in-pr.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # Nearly all of the lane is building its two store schemas through
    # the full migration history: locally on 2026-10-22, 244 s for the
    # first and 89 s for the second, against under a minute for the 150
    # tests. That cost grows with every migration, and splitting the lane
    # would not cut it, since each shard would build the schemas again.
    # Its green CI runs took 8-14 minutes on 2026-10-21/22, and one was
    # cancelled at the old 15-minute limit right after "150 passed". 25
    # leaves room for slower runners; raise it again only with a fresh
    # measurement. (Creating the second schema by cloning the first,
    # TENANT_CREATION_FAKES_MIGRATIONS, is not the way out: django-tenants
    # warns it can be slower, and it would copy the first store's test
    # rows into the store the isolation tests compare it with.)
    timeout-minutes: 25
    # ``tests_mt/`` is a SIBLING of ``tests/``, deliberately excluded from
    # `testpaths` and from the ``testing`` job above: it keeps the real
    # ``TenantSyncRouter`` + ``TenantMainMiddleware`` (the main suite strips
    # both for speed), so schema-binding regressions the 6000+ test suite
    # can never see — a cross-schema FK, a cache-key leak, a seed migration
    # that silently stops reaching new tenants — fail here instead. See
    # ``tests_mt/conftest.py`` and CLAUDE.md's test section.
    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Start PostgreSQL
        # Same tuned container as the ``testing`` job — see its comment.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --mount type=tmpfs,destination=/var/lib/postgresql \
            postgres:18.6-alpine3.23 \
            -c max_locks_per_transaction=256 -c max_connections=200
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become ready" >&2
          docker logs ci-postgres >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install psycopg and gettext prerequisites
        # gettext for ``compilemessages`` below; the runner image does
        # not ship msgfmt.
        run: sudo apt-get install -y --no-install-recommends libpq-dev gettext

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Compile translations
        # The same step as the Dockerfile's, so tests run against the
        # Greek catalogue production serves. Without it gettext fell back
        # to the English msgid here and a test asserting English text
        # passed in CI but failed on any machine that had compiled the
        # catalogue — the ``assert_english`` marker (tests/conftest.py)
        # is what such a test needs, and only this step makes CI notice
        # a missing one.
        run: uv run python manage.py compilemessages --ignore=.venv

      - name: Run MT lane
        # Serial (-n 0): the lane is small (~10 tests) and schema
        # switching is process-global via ``connection`` — xdist would
        # need per-worker schemas for no real benefit here.
        run: uv run pytest tests_mt -n 0

  coverage:
    name: Coverage Gate
    needs: testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine and enforce coverage
        # ``coverage report`` reads ``fail_under`` from pyproject
        # (currently 70) and exits non-zero below it — the single
        # coverage gate for the whole suite. ``relative_files = true``
        # in the coverage config is what makes data files combinable
        # across runners.
        run: |
          uv run coverage combine coverage-shard-*
          uv run coverage report

  release:
    needs:
      [tested-in-pr, quality, migrations, testing, test-mt, coverage, security-scan]
    # ``!cancelled()`` replaces the implicit ``success()``, which would
    # treat the skipped gates of an already-tested push as a reason not to
    # run. A gate may be skipped only when tested-in-pr itself succeeded
    # and said ``tested``: if that job fails before its check, its
    # dependents skip too, and that must block the release.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.tested-in-pr.result == 'success'
      && needs.security-scan.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.tested-in-pr.outputs.tested == 'true'
          || !contains(needs.*.result, 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: release
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The PAT, not GITHUB_TOKEN: the version commit + tag pushed
          # below must be attributed the same way the PSR action did
          # it, and the release event it creates must trigger the
          # docker publish workflow (GITHUB_TOKEN events do not).
          token: ${{ secrets.DJANGO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/*requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Python Semantic Release
        # Inline instead of the python-semantic-release ACTION: its
        # Docker image pip-installs dependencies UNPINNED at workflow
        # runtime, so a transitive release can break every run at once
        # (GitPython 3.1.60 did exactly that in 2026-08). PSR is a dev
        # dependency, so run it from the LOCKED environment: every
        # transitive pin comes from uv.lock, and --locked refuses to run
        # if the lock is stale. --only-group dev skips the runtime deps.
        # The version commit it pushes already carries the re-locked
        # uv.lock (build_command + assets in pyproject.toml).
        env:
          GH_TOKEN: ${{ secrets.DJANGO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run --locked --only-group dev semantic-release -v version
