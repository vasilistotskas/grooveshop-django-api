# Tell us when the storefront's converter fixtures changed.
#
# tests/fixtures/builder/legacy/ is a pinned COPY of the storefront's
# test/fixtures/builder/legacy/ (see .github/scripts/sync_converter_fixtures.py
# and tests/unit/builder/test_converter_fixture_pin.py). A pull request can
# never edit the copy out of step with its pin; what only time can do is let
# the storefront move on. This job asks, weekly, and goes red in the Actions
# tab when it has, so a stale copy is noticed without blocking an unrelated
# pull request. Fixing it: run the script, replay
# tests/integration/builder/test_converter_fixtures.py, commit the copy.
name: Converter fixtures

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Copy matches the storefront
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the storefront's main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_converter_fixtures.py --check
