# Tell us when something we copied from the storefront changed.
#
# The storefront owns the page builder's blocks, so two things are pinned
# COPIES of its files (see .github/scripts/sync_storefront_sources.py and
# tests/unit/builder/test_storefront_sources_pin.py): a snapshot of the
# block catalogue, and the default documents a new store is seeded with
# (builder/seeds/). A pull request can
# never edit a copy out of step with its pin; what only time can do is let
# the storefront move on. This job asks, weekly, and goes red in the Actions
# tab when it has, so a stale copy is noticed without blocking an unrelated
# pull request. Fixing it: run the script, replay the builder tests
# (tests/unit/builder/test_seeds.py and
# tests/unit/builder/test_real_catalogue.py), commit the copies.
name: Storefront sources

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Copies match the storefront
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the storefront's main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_storefront_sources.py --check
