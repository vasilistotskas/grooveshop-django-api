# consumer.yml with a property of a component made nullable, reached through
# an allOf as well as a $ref (v3.166.2): reported once, by the nullability pass.
openapi: 3.0.3
info: {title: fixture, version: "1"}
paths:
  /comment:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
      required:
      - id
      - name
    Comment:
      type: object
      properties:
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        parent:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
          required:
          - user
      required:
      - author
      - parent
    CommentRequest:
      type: object
      properties:
        text:
          type: string
        replyTo:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
      required:
      - text
