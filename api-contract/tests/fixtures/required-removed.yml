# consumer.yml with a required property removed from an object inside an
# allOf branch (2026-10-27): the flattened pass must keep refusing it.
openapi: 3.0.3
info: {title: fixture, version: "1"}
paths:
  /comment:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
    Comment:
      type: object
      properties:
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        parent:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
          required:
          - user
      required:
      - author
      - parent
    CommentRequest:
      type: object
      properties:
        text:
          type: string
        replyTo:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
      required:
      - text
