{% comment %}
What a widget shows when it has nothing to show - never an empty canvas
or a bare table.
{% endcomment %}
<div class="flex flex-col gap-2 grow items-center justify-center px-4 py-8 text-center{% if class %} {{ class }}{% endif %}">
    <span class="material-symbols-outlined text-base-300 text-4xl! dark:text-base-600">{{ icon|default:"inbox" }}</span>
    <p class="max-w-xs text-sm text-subtle">{{ text }}</p>
</div>
