{% extends "emails/base/email_base.html" %}
{% load i18n %}

{% comment %}
Was the only email template in the tree that did not extend the base:
it carried its own <style> block with a hardcoded #1c2d5e palette
belonging to no tenant, a hardcoded lang="el" that ignored the language
the task activates, and no logo despite the task already building
context via build_email_context(). Extending the base gives it the
tenant logo header, the tenant footer, the recipient's language on
<html>, and the themed palette — and removes the last hardcoded brand
colour from the email tree.
{% endcomment %}

{% block email_title %}{% trans "Your BOX NOW parcel arrived" %}{% endblock %}

{% block email_content %}
<h1>{% trans "Your BOX NOW parcel has arrived!" %}</h1>

<p>{% blocktrans with first_name=order.first_name %}Hello {{ first_name }},{% endblocktrans %}</p>

<p>
  {% blocktrans with order_id=order.id %}
    Great news! Your parcel for order <strong>#{{ order_id }}</strong> has arrived at the
    BOX NOW locker and is ready for pickup.
  {% endblocktrans %}
</p>

<table class="email-table">
  <tr>
    <th>{% trans "Voucher number" %}</th>
    <td><strong>{{ shipment.parcel_id }}</strong></td>
  </tr>
  <tr>
    <th>{% trans "Locker address" %}</th>
    <td>{{ locker_address }}</td>
  </tr>
  {% if locker %}
  <tr>
    <th>{% trans "Locker name" %}</th>
    <td>{{ locker.name }}</td>
  </tr>
  {% endif %}
</table>

<p>{% trans "Your parcel is available for pickup 24 hours a day, 7 days a week." %}</p>

{% if SITE_URL %}
<a class="email-button" href="{{ SITE_URL }}/account/orders/{{ order.id }}">
  {% trans "View Order" %}
</a>
{% endif %}
{% endblock %}
