services:
  db:
    container_name: postgresql_db
    image: postgres:18.6-alpine3.23
    # PG18 consumes more lock-table entries than 17 for the same
    # parallel DDL (xdist suite errored with out-of-shared-memory at
    # defaults; shm-size alone did NOT fix it — max_locks did).
    command: postgres -c max_locks_per_transaction=256
    shm_size: 512m
    restart: no
    volumes:
      # postgres18_data: fresh volume for the PG18 major (the old
      # postgres_data volume holds a PG17 data dir that 18 cannot boot;
      # it is kept as an instant rollback until confidence is earned).
      # 18+ images store data in major-versioned subdirectories and
      # REFUSE a mount at the legacy /var/lib/postgresql/data path — the
      # parent mount is the documented convention (enables
      # pg_upgrade --link across majors without crossing mount points).
      - postgres18_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U postgres -d postgres'" ]
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - grooveshop-backbone

  redis:
    container_name: redis
    image: redis:8-alpine
    restart: no
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grooveshop-backbone

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: no
    volumes:
      - ./docker/pg/servers.json:/pgadmin4/servers.json
    environment:
      - PGADMIN_DEFAULT_EMAIL=postgres@postgres.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    depends_on:
      - db
    networks:
      - grooveshop-backbone

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.3.5-management
    restart: no
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grooveshop-backbone

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.53.1
    env_file:
      - ./docker/meilisearch/.env
    volumes:
      - meilisearch:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://meilisearch:7700/health"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - grooveshop-backbone

  redisinsight:
    container_name: redisinsight
    image: redislabs/redisinsight:latest
    restart: no
    ports:
      - '13333:8001'
    depends_on:
      - redis
    networks:
      - grooveshop-backbone

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    restart: no
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/readyz"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - grooveshop-backbone

volumes:
  postgres_data:
  postgres18_data:
  service-media_stream:
  meilisearch:
    driver: local

networks:
  grooveshop-backbone:
    driver: bridge
