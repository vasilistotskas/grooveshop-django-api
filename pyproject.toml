[project]
version = "3.28.5"
name = "grooveshop-django-api"
authors = [
  { name = "Vasilis Totskas", email = "vassilistotskas@msn.com" }
]
description = "GrooveShop Django Backend"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = [
  "channels[daphne]==4.3.2",
  "channels-redis==4.3.0",
  "django==6.0.8",
  "django-admin-thumbnails==1.0.0",
  "django-allauth[idp-oidc]==65.19.2",
  "django-extra-settings==0.15.0",
  "django-celery-beat==2.9.0",
  "django-celery-results==2.6.0",
  "django-cors-headers==4.9.0",
  "django-simple-history==3.13.0",
  "django-filter==26.1",
  "django-unfold==0.104.1",
  "django-money==3.6.1",
  "django-mptt==0.18.0",
  "django-parler==2.4.0",
  "django-parler-rest==2.2.0",
  "django-phonenumber-field==8.5.0",
  "django-rosetta==0.10.3",
  "django-rest-knox==5.1.0",
  "django-tinymce==5.0.0",
  "djangorestframework==3.18.0",
  "djangorestframework-camel-case==1.4.2",
  "drf-spectacular==0.30.0",
  "fido2==2.2.1",
  "flower==2.1.0",
  "gunicorn==26.2.0",
  "measurement==3.2.2",
  "meilisearch==0.43.0",
  "phonenumbers==9.0.38",
  "pillow==12.3.0",
  "psycopg[binary,pool]==3.3.5",
  "python-dotenv==1.2.3",
  "qrcode==8.2",
  "urllib3==2.7.0",
  "uvicorn==0.52.4",
  "celery[redis] >=5.6.3,<6.0.0",
  "disposable-email-domains==0.0.247",
  "django-stubs-ext==6.0.9",
  "dj-stripe==2.11.0",
  "defusedxml>=0.7.1",
  "django-tenants>=3.14.0,<4.0.0",
  "nh3>=0.3.6",
  "weasyprint>=69.0",
  "requests==2.34.2",
  "xmlschema==4.3.2",
  "argon2-cffi>=25.1.0",
  "facebook-business==26.0.1",
  "uvicorn-worker>=0.4.0",
  "websockets>=17.0.1",
]

[project.urls]
repository = "https://github.com/vasilistotskas/grooveshop-django-api"

# ─────────────────────────────────────────────────────────
# Dev (and other) dependency groups
# ─────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "coverage[toml]==7.16.0",
    "djangorestframework-stubs==3.18.0",
    "django-debug-toolbar==8.0.0",
    "django-stubs==6.0.9",
    "Faker==40.38.0",
    "factory-boy==3.3.3",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-django==4.14.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "pytest-cov==7.1.0",
    "python-semantic-release==10.6.2",
    "ruff==0.16.6",
    "celery-stubs==0.1.3",
    "psutil==7.2.2",
    "hypothesis==6.167.1",
    "ty==0.0.78",
    "pytest-split==0.11.0",
]

# ─────────────────────────────────────────────────────────
# Coverage configuration
# ─────────────────────────────────────────────────────────
[tool.coverage.paths]
source = ["."]

[tool.coverage.run]
branch = true
parallel = true
# ``sysmon`` uses sys.monitoring (PEP 669) instead of the C tracer —
# drastically lower measurement overhead. Branch coverage under sysmon
# requires Python 3.14+; on older interpreters coverage falls back with
# a warning. Validated 2026-08-25 on coverage 7.14.0 / Python 3.14.7:
# identical totals to ctrace, branch arcs recorded.
core = "sysmon"
concurrency = ["multiprocessing", "thread"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/management/*",
    "*/factories/*",
    "*/manage.py",
    "*/factories.py",
    "gunicorn_worker.py",
    "*/wsgi/*",
]
source = ["."]
relative_files = true

[tool.coverage.report]
precision = 2
skip_covered = true
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise AssertionError",
    "return NotImplemented",
    "if TYPE_CHECKING:",
    "if getattr(self, 'swagger_fake_view', False):",
    "if 0:",
    "if __name__ == .__main__.:",
    "def __repr__",
    "@(abstractmethod|abc.abstractmethod)",
    "if self.debug:",
    "if settings.DEBUG:",
]

[tool.coverage.html]
directory = "htmlcov"

# ─────────────────────────────────────────────────────────
# Coverage commands reference
# ─────────────────────────────────────────────────────────
# Run tests with coverage (sequential, recommended for coverage):
#   uv run pytest --cov=. --cov-report=term --cov-report=html --cov-config=pyproject.toml
#
# Run tests in parallel (fast, no coverage):
#   uv run pytest -n auto
#
# Run specific test with coverage:
#   uv run pytest tests/path/to/test.py --cov=module_name --cov-report=term
#
# Quick test run without coverage:
#   uv run pytest

# ─────────────────────────────────────────────────────────
# Semantic release configuration
# ─────────────────────────────────────────────────────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
# No build_command: this is a deployed application, not a library. The
# Docker image workflow triggers on the published release and never
# consumes sdist/wheel assets, so nothing is built or uploaded.
commit_message = "chore(release): release version {version} [skip ci]"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = false

[tool.semantic_release.changelog]
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

# ─────────────────────────────────────────────────────────
# Pytest configuration
# ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 600
# ``--dist loadfile`` keeps every test inside a file pinned to one xdist
# worker. With ``worksteal``, tests from different files end up
# interleaved on the same process — fine for pure unit tests but
# corrosive here, because module-level singletons (e.g.
# ``core.middleware.translation_reload._local_translation_version``,
# extra-settings cache, factory random state) carry over between
# unrelated tests, and EAGER signal cascades from one test's
# OrderFactory call can pollute another test's mocks. ``loadfile``
# costs ~30% more wall-time but is the difference between a stable
# suite and 1-3 random flakes per run.
# ``--reuse-db`` keeps each xdist worker's test database between runs, so the
# 285-migration replay (the dominant cost — it runs once per worker) only
# happens on a COLD build. Pass ``--create-db`` to force a rebuild after adding
# a migration. Safe for CI: its Postgres container is fresh each run, so there
# is nothing to reuse and behaviour is unchanged; the win is purely local.
addopts = "--tb=short --maxfail=0 -n auto --dist loadfile --reuse-db"
# Third-party deprecation noise we cannot fix here — each entry names the
# offending package and the upstream state so it can be dropped on upgrade:
# - daphne pins the Windows selector event-loop policy for Twisted compat
#   (daphne/__init__.py); Python 3.14 deprecates both the policy class and
#   set_event_loop_policy (removal slated for 3.16). Re-tested 2026-08-14
#   on daphne 4.2.1: both still fire.
#   (The former drf-spectacular _UnionGenericAlias filter was dropped
#   2026-08-14 — 0.30.0 ships the tfranzel/drf-spectacular#1497 fix and
#   the warning no longer fires under schema-generation tests.)
filterwarnings = [
    "ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning:daphne",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning:daphne",
]
markers = [
    "assert_english: pin gettext active language to English so substring assertions on validator / admin error messages stay stable when the compiled ``el`` ``.mo`` files happen to be present locally.",
]

# ─────────────────────────────────────────────────────────
# uv configuration — transitive-dependency overrides for
# CVEs found by Trivy. Both packages are indirect deps but
# their fixed versions are drop-in compatible.
# ─────────────────────────────────────────────────────────
[tool.uv]
override-dependencies = [
    # CVE-2026-35536, CVE-2026-31958 (HIGH) — fixed in 6.5.5
    # CVE-2026-49855, CVE-2026-49853 (HIGH) — fixed in 6.5.6
    # CVE-2026-82397 (HIGH) — fixed in 6.5.8
    "tornado>=6.5.8",
    # CVE-2026-42304 (HIGH) — DoS in twisted.names DNS compression
    # pointer chains; fixed in 26.4.0 (stable since 2026-08).
    # Extras kept inline so the resolver preserves pyopenssl/h2 etc.
    "twisted[http2,tls]>=26.4.0",
    # CVE-2026-71491, CVE-2026-59893, CVE-2026-54284 (HIGH) — three
    # quadratic-CPU paths in grouping/lexer/TokenList reachable from
    # sqlparse.parse/format/split; all fixed in 0.6.0. Transitive via
    # django and django-debug-toolbar, both of which floor at >=0.3.1.
    "sqlparse>=0.6.0",
]

# ─────────────────────────────────────────────────────────
# Django-stubs configuration
# ─────────────────────────────────────────────────────────
[tool.django-stubs]
django_settings_module = "settings"

# ─────────────────────────────────────────────────────────
# Ruff configuration
# ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py314"
line-length = 80
exclude = ["**/migrations/**"]

[tool.ruff.lint]
# Ruff 0.16 turned on a much broader default set, which is what every
# contributor's editor shows out of the box — so that is the baseline
# here rather than a hand-picked `select`. Before this, the section did
# not exist at all: only the 59 legacy defaults ran, which is why 364
# `# noqa` comments in the tree suppressed rules that were never on.
extend-select = [
    # Dropped from 0.16's defaults, re-added: each is a real bug shape,
    # and all six are already at zero findings here, so enforcing them
    # costs nothing and stops a regression.
    "E402", # module import not at top of file
    "E722", # bare except
    "E731", # lambda assigned to a name
    "E741", # ambiguous variable name (l, I, O)
    "F403", # `from x import *`
    "F405", # name may be undefined, or defined from star imports
    "A",    # builtin shadowing
    "DJ",   # Django-specific correctness
    # PLR0917, not PLR0913. PLR0913 counts EVERY parameter, so it fires
    # just as loudly on a function whose arguments are all keyword-only —
    # which is the shape its own remedy recommends and which cannot be
    # mixed up at a call site. Ten of the fourteen it flagged here were
    # already keyword-only. PLR0917 counts POSITIONAL parameters, which
    # is the thing that actually goes wrong silently.
    "PLR0917", # too many POSITIONAL arguments
    "T20",  # print / pprint left in the tree
    "TID",  # banned and relative imports
]
ignore = [
    # Lazy imports are the house pattern: modules import inside
    # functions to stay importable before the app registry is ready and
    # to break circular imports between apps. 1744 of them.
    "PLC0415",
    # Django and DRF declare mutable class attributes by design —
    # `Meta.indexes`, `serializers_config`, `fields`. 661 of them.
    "RUF012",
    # Greek copy is the product's default locale, so "ambiguous"
    # Cyrillic/Greek lookalikes are simply the correct characters.
    "RUF001",
    "RUF002",
    "RUF003",
    # Signal receivers, DRF hooks and Celery task bodies take arguments
    # the framework passes and the body does not read.
    "ARG",
    # Magic values are overwhelmingly test fixtures and HTTP status
    # codes; the signal-to-noise does not justify 819 suppressions.
    "PLR2004",
    # 120 blind `except Exception` handlers. Each needs a judgement
    # about what it is really catching, which is the Phase 4 triage —
    # not something to settle with a blanket autofix here.
    "BLE001",
    # ERA001 was enabled and then withdrawn after reading all 13
    # production hits: 12 are prose, not code. This codebase documents
    # with comments that contain `=`, dotted paths and parenthesised
    # tuples — "# (slug, name, price)" heading a data table,
    # "#   SOCIALACCOUNT_EMAIL_AUTHENTICATION = True" recording a
    # setting. One hit is worse than noise: `# xgettext:no-python-format`
    # in order/admin.py is a FUNCTIONAL directive, and ERA001's fix
    # deletes it, which hard-fails msgfmt on the Greek catalogue.
    # A rule that is 1-in-13 right and can break the build on the
    # remainder is not worth its suppressions.
    "ERA001",
    # DJ001 (nullable CharField/TextField/URLField) is a REAL finding on
    # all 13 sites and is deliberately deferred, not dismissed. Making a
    # string column NOT NULL is a two-RELEASE change under the Argo CD
    # PreSync hook, because migrations run before the new image: the
    # ALTER lands while pods that still write NULL are serving, so the
    # first release has to stop writing NULL and backfill, and only the
    # second may add the constraint. That sequencing belongs in its own
    # change with the migration-safety review, not folded into a lint
    # pass. The 13:
    #   order.Order.payment_id          — the worst: `null=True` AND
    #                                     `default=""`, so "no payment
    #                                     id" has two spellings
    #   search.SearchQuery              — language_code, session_key,
    #                                     user_agent
    #   shipping_boxnow                 — BoxNowLocker.image_url,
    #                                     BoxNowParcelEvent.data_fingerprint
    #   user.UserAccount                — seven social profile URLs
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and pytest rewrites those asserts — 6527 of them.
# TRY002: a test that simulates "something arbitrary went wrong" raises
#   `Exception` on purpose; a bespoke class would assert less, not more.
# DJ008: `__str__` on the throwaway models declared inside
#   test_manager_delegation.py to exercise manager delegation.
# S110: the conftest deliberately swallows — it emulates
#   `on_commit(..., robust=True)` and closes connections best-effort;
#   each site already carries a `# pragma: no cover` saying so.
# All four are 100% test-only — measured, not assumed.
# SIM117: stacked `with mock.patch(...)` blocks. All 19 are in tests,
#   and at 80 columns the collapsed form needs a parenthesised context
#   group — churning test structure for no behavioural gain. The rule
#   stays enforced in production code, where it is already clean.
# PLR0917: pytest injects fixtures POSITIONALLY, and `@mock.patch`
#   passes each mock as a positional argument in bottom-up order. A test
#   with several of either cannot be given keyword-only parameters — the
#   rule is unsatisfiable there by construction, not by choice.
"tests/**" = ["S101", "TRY002", "DJ008", "S110", "SIM117", "PLR0917"]
"tests_mt/**" = ["S101", "TRY002", "DJ008", "S110", "SIM117", "PLR0917"]
# Seeding helpers print deliberate, `verbose`-gated progress for an
# operator watching `seed_all` run. They are shared by the management
# command and the test factories, so they have no `self.stdout` to write
# to, and routing operator-facing progress into the log would hide it.
"country/factories.py" = ["T201"]
"region/factories.py" = ["T201"]
"devtools/management/commands/seed_all.py" = ["T201"]

[tool.ruff.lint.pylint]
max-positional-args = 6

# ─────────────────────────────────────────────────────────
# ty type checker configuration
# ─────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Django ORM metaclass: reverse relations, FK _id accessors,
# get_*_display(), AbstractBaseUser attrs, Celery .delay(),
# Parler/MPTT methods — ty lacks django-stubs mypy plugin support
# (https://github.com/astral-sh/ty/blob/main/docs/reference/typing-faq.md)
unresolved-attribute = "ignore"
# Django `objects = SomeManager()` and `REQUIRED_FIELDS = [...]` are
# the canonical Django patterns, but django-stubs declares both as
# ClassVar on the base class, so ty (since 0.0.33) flags every model
# for "instance variable cannot override class variable". django-stubs'
# mypy plugin reconciles this via descriptor handling; ty cannot.
invalid-attribute-override = "ignore"

[tool.ty.src]
exclude = [
    "**/migrations/**",
]

# Tests: factory_boy, DRF test client, Celery eager tasks, Mock/patch.
# missing-typed-dict-key: tests intentionally pass partial dicts to
# exercise validation error paths.
[[tool.ty.overrides]]
include = ["tests/**", "**/tests/**", "**/test_*.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"
missing-argument = "ignore"
too-many-positional-arguments = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
no-matching-overload = "ignore"
missing-typed-dict-key = "ignore"

# factory_boy stubs: class-level SubFactory/LazyFunction descriptors
# are typed as the wrapper, not the resolved model attribute, so
# reassigning them on instances trips invalid-assignment.
[[tool.ty.overrides]]
include = [
    "**/factories/**",
    "**/factories.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

# Library type stub limitations: measurement, ASGI, drf-spectacular,
# django-money, factory_boy, meilisearch SDK
[[tool.ty.overrides]]
include = [
    "core/fields/**",
    "core/forms/**",
    "core/filters/**",
    "core/utils/**",
    "asgi/**",
    "admin/**",
    "meili/**",
    "devtools/**",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
call-non-callable = "ignore"
too-many-positional-arguments = "ignore"
unsupported-operator = "ignore"
invalid-return-type = "ignore"

# django-unfold's @action decorator is annotated as `-> Action`
# but actually returns the inner decorator callable, so ty flags
# every `@action(...)` usage as call-non-callable. Suppress for
# all per-app admin modules until upstream stubs are fixed.
[[tool.ty.overrides]]
include = ["**/admin.py"]

[tool.ty.overrides.rules]
call-non-callable = "ignore"

# Stripe SDK uses `Unpack[TypedDict]` for **kwargs on create() methods
# (e.g. SessionCreateParams). We build payload dicts incrementally with
# heterogeneous values, so the dict's inferred type is a union that
# can't satisfy each TypedDict field individually. ty (since 0.0.33)
# emits one diagnostic per field, producing ~75 errors per call site.
[[tool.ty.overrides]]
include = ["order/payment.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
