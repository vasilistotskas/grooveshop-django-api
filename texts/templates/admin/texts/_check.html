{% load i18n %}
{% if error %}
    <p class="flex gap-1 items-start mb-0 text-red-600 text-sm dark:text-red-400" role="alert">
        <span class="material-symbols-outlined text-base">error</span>
        <span>
            {{ error.messages.0 }}
            {% if error.params.detail %}<span class="block text-subtle text-xs">{{ error.params.detail }}</span>{% endif %}
        </span>
    </p>
{% elif valid %}
    <p class="flex gap-1 items-center mb-0 text-green-700 text-sm dark:text-green-400">
        <span class="material-symbols-outlined text-base">check_circle</span>
        {% trans "This text is fine." %}
    </p>
{% endif %}
